<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="مدیریت کارهای جرثقیلی">
    <link rel="manifest" href="manifest.json">
    <title>مدیریت کارهای جرثقیلی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            color: #2563eb;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            color: #64748b;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-box .label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-box .value {
            font-size: 20px;
            font-weight: bold;
        }

        .form-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #334155;
            font-weight: 600;
            font-size: 14px;
        }

        .input-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .form-group input,
        .form-group select {
            flex: 1;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .voice-btn {
            width: 45px;
            height: 45px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .voice-btn:active {
            transform: scale(0.95);
        }

        .voice-btn.listening {
            animation: pulse 1.5s infinite;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .records-list {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .records-header {
            padding: 15px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-box {
            padding: 15px;
            border-bottom: 2px solid #f1f5f9;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
        }

        .record-item {
            padding: 15px 20px;
            border-bottom: 1px solid #f1f5f9;
            transition: background 0.2s;
        }

        .record-item:hover {
            background: #f8fafc;
        }

        .record-item:last-child {
            border-bottom: none;
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .record-date {
            color: #2563eb;
            font-weight: bold;
            font-size: 14px;
        }

        .record-amount {
            color: #059669;
            font-weight: bold;
            font-size: 16px;
        }

        .record-details {
            display: grid;
            gap: 5px;
            font-size: 14px;
            color: #64748b;
            margin-bottom: 10px;
        }

        .record-detail {
            display: flex;
            gap: 5px;
        }

        .record-detail strong {
            color: #334155;
            min-width: 80px;
        }

        .record-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-edit {
            background: #3b82f6;
            color: white;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .btn-call {
            background: #10b981;
            color: white;
        }

        .btn-small:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .work-type-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .work-type-btn {
            padding: 8px;
            background: #f1f5f9;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            text-align: center;
        }

        .work-type-btn:hover {
            background: #e2e8f0;
        }

        .work-type-btn.selected {
            background: #dbeafe;
            border-color: #2563eb;
            color: #2563eb;
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            max-width: 400px;
            width: 100%;
        }

        .modal-header {
            font-size: 18px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 15px;
            text-align: center;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏗️ مدیریت کارهای جرثقیلی</h1>
            <p>ثبت و پیگیری کارها</p>
            <div class="stats">
                <div class="stat-box">
                    <div class="label">تعداد کارها</div>
                    <div class="value" id="totalCount">0</div>
                </div>
                <div class="stat-box">
                    <div class="label">مجموع درآمد</div>
                    <div class="value" id="totalAmount">0</div>
                </div>
            </div>
        </div>

        <div class="form-card">
            <form id="workForm">
                <div class="form-group">
                    <label>📅 تاریخ</label>
                    <div class="input-wrapper">
                        <input type="text" id="date" placeholder="مثال: ۱۵ آذر ۱۴۰۳" required>
                        <button type="button" class="voice-btn" onclick="startVoiceInput('date')" title="ورودی صوتی">🎤</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>👤 نام مشتری</label>
                    <div class="input-wrapper">
                        <input type="text" id="customerName" placeholder="مثال: علی مرادی">
                        <button type="button" class="voice-btn" onclick="startVoiceInput('customerName')" title="ورودی صوتی">🎤</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>📞 شماره تلفن</label>
                    <div class="input-wrapper">
                        <input type="tel" id="phone" placeholder="09123456789" required>
                        <button type="button" class="voice-btn" onclick="startVoiceInput('phone')" title="ورودی صوتی">🎤</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>🔧 نوع کار</label>
                    <div class="input-wrapper">
                        <input type="text" id="workType" placeholder="مثال: تانک آب" required>
                        <button type="button" class="voice-btn" onclick="startVoiceInput('workType')" title="ورودی صوتی">🎤</button>
                    </div>
                    <div class="work-type-buttons">
                        <div class="work-type-btn" onclick="selectWorkType('تانک آب')">تانک آب</div>
                        <div class="work-type-btn" onclick="selectWorkType('حمل مصالح')">حمل مصالح</div>
                        <div class="work-type-btn" onclick="selectWorkType('نصب تیرآهن')">نصب تیرآهن</div>
                        <div class="work-type-btn" onclick="selectWorkType('بلند کردن بار')">بلند کردن بار</div>
                        <div class="work-type-btn" onclick="selectWorkType('کانکس')">کانکس</div>
                        <div class="work-type-btn" onclick="selectWorkType('سایر')">سایر</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>💰 مبلغ (تومان)</label>
                    <div class="input-wrapper">
                        <input type="text" id="amount" placeholder="مثال: ۵۰۰۰۰۰۰" required>
                        <button type="button" class="voice-btn" onclick="startVoiceInput('amount')" title="ورودی صوتی">🎤</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">✅ ثبت کار</button>
            </form>
        </div>

        <div class="records-list">
            <div class="records-header">
                <h2>📋 لیست کارها</h2>
                <span id="recordCount">0 مورد</span>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 جستجو بر اساس نام، شماره یا نوع کار...">
            </div>
            <div id="recordsList"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <div class="modal-header">⚠️ حذف کار</div>
            <p style="text-align: center; color: #64748b; margin-bottom: 20px;">آیا از حذف این کار مطمئن هستید؟</p>
            <div class="modal-actions">
                <button class="btn btn-primary" style="background: #94a3b8;" onclick="closeDeleteModal()">انصراف</button>
                <button class="btn btn-primary" style="background: #ef4444;" onclick="confirmDelete()">حذف</button>
            </div>
        </div>
    </div>

    <script>
        let records = JSON.parse(localStorage.getItem('craneRecords')) || [];
        let editingIndex = -1;
        let deleteIndex = -1;
        let recognition = null;
        let currentVoiceField = null;

        // Initialize Speech Recognition
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'fa-IR';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                handleVoiceResult(transcript);
            };

            recognition.onerror = function(event) {
                console.error('Speech recognition error', event.error);
                showToast('خطا در تشخیص صدا. لطفاً دوباره تلاش کنید.');
                stopVoiceInput();
            };

            recognition.onend = function() {
                stopVoiceInput();
            };
        }

        function startVoiceInput(fieldName) {
            if (!recognition) {
                showToast('مرورگر شما از ورودی صوتی پشتیبانی نمی‌کند');
                return;
            }

            currentVoiceField = fieldName;
            const btn = event.target;
            btn.classList.add('listening');
            btn.textContent = '🔴';
            
            try {
                recognition.start();
                showToast('در حال گوش دادن... صحبت کنید');
            } catch (error) {
                console.error('Error starting recognition:', error);
                stopVoiceInput();
            }
        }

        function stopVoiceInput() {
            if (recognition) {
                recognition.stop();
            }
            document.querySelectorAll('.voice-btn').forEach(btn => {
                btn.classList.remove('listening');
                btn.textContent = '🎤';
            });
        }

        function handleVoiceResult(text) {
            if (!currentVoiceField) return;

            const field = document.getElementById(currentVoiceField);
            
            // Clean up the text
            let cleanText = text.trim();

            // Special handling for phone numbers
            if (currentVoiceField === 'phone') {
                cleanText = cleanText.replace(/\s+/g, '');
                // Convert Persian/Arabic numbers to English
                cleanText = cleanText.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
                                     .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
            }

            // Special handling for amounts
            if (currentVoiceField === 'amount') {
                // Remove common words
                cleanText = cleanText.replace(/تومان|ریال|میلیون/g, '').trim();
                // Convert Persian/Arabic numbers to English
                cleanText = cleanText.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
                                     .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
                
                // Handle "million" mentions
                if (text.includes('میلیون')) {
                    const num = parseFloat(cleanText.replace(/[^0-9.]/g, ''));
                    if (!isNaN(num)) {
                        cleanText = (num * 1000000).toString();
                    }
                }
            }

            field.value = cleanText;
            showToast(`✅ "${cleanText}" ثبت شد`);
            stopVoiceInput();
        }

        function selectWorkType(type) {
            document.getElementById('workType').value = type;
            document.querySelectorAll('.work-type-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            event.target.classList.add('selected');
        }

        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function saveRecords() {
            localStorage.setItem('craneRecords', JSON.stringify(records));
            updateStats();
            renderRecords();
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = records.length;
            const total = records.reduce((sum, r) => sum + parseFloat(r.amount.replace(/,/g, '') || 0), 0);
            document.getElementById('totalAmount').textContent = formatNumber(total);
        }

        function renderRecords(filteredRecords = null) {
            const recordsList = document.getElementById('recordsList');
            const displayRecords = filteredRecords || records;
            
            document.getElementById('recordCount').textContent = `${displayRecords.length} مورد`;

            if (displayRecords.length === 0) {
                recordsList.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <p>هنوز کاری ثبت نشده است</p>
                    </div>
                `;
                return;
            }

            recordsList.innerHTML = displayRecords.map((record, index) => `
                <div class="record-item">
                    <div class="record-header">
                        <div class="record-date">📅 ${record.date}</div>
                        <div class="record-amount">${formatNumber(record.amount)} تومان</div>
                    </div>
                    <div class="record-details">
                        ${record.customerName ? `<div class="record-detail"><strong>👤 نام:</strong> <span>${record.customerName}</span></div>` : ''}
                        <div class="record-detail"><strong>📞 تلفن:</strong> <span>${record.phone}</span></div>
                        <div class="record-detail"><strong>🔧 نوع کار:</strong> <span>${record.workType}</span></div>
                    </div>
                    <div class="record-actions">
                        <button class="btn-small btn-call" onclick="callNumber('${record.phone}')">📞 تماس</button>
                        <button class="btn-small btn-edit" onclick="editRecord(${record.originalIndex !== undefined ? record.originalIndex : index})">✏️ ویرایش</button>
                        <button class="btn-small btn-delete" onclick="showDeleteModal(${record.originalIndex !== undefined ? record.originalIndex : index})">🗑️ حذف</button>
                    </div>
                </div>
            `).join('');
        }

        function callNumber(phone) {
            window.location.href = `tel:${phone}`;
        }

        function editRecord(index) {
            editingIndex = index;
            const record = records[index];
            
            document.getElementById('date').value = record.date;
            document.getElementById('customerName').value = record.customerName || '';
            document.getElementById('phone').value = record.phone;
            document.getElementById('workType').value = record.workType;
            document.getElementById('amount').value = record.amount;
            
            document.querySelector('.btn-primary').textContent = '✏️ ویرایش کار';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast('در حال ویرایش...');
        }

        function showDeleteModal(index) {
            deleteIndex = index;
            document.getElementById('deleteModal').classList.add('show');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('show');
            deleteIndex = -1;
        }

        function confirmDelete() {
            if (deleteIndex !== -1) {
                records.splice(deleteIndex, 1);
                saveRecords();
                showToast('✅ کار حذف شد');
                closeDeleteModal();
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        document.getElementById('workForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const record = {
                date: document.getElementById('date').value,
                customerName: document.getElementById('customerName').value,
                phone: document.getElementById('phone').value,
                workType: document.getElementById('workType').value,
                amount: document.getElementById('amount').value.replace(/,/g, '')
            };

            if (editingIndex !== -1) {
                records[editingIndex] = record;
                editingIndex = -1;
                showToast('✅ کار ویرایش شد');
                document.querySelector('.btn-primary').textContent = '✅ ثبت کار';
            } else {
                records.unshift(record);
                showToast('✅ کار جدید ثبت شد');
            }

            saveRecords();
            this.reset();
            document.querySelectorAll('.work-type-btn').forEach(btn => btn.classList.remove('selected'));
        });

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            
            if (!searchTerm) {
                renderRecords();
                return;
            }

            const filtered = records
                .map((record, index) => ({ ...record, originalIndex: index }))
                .filter(record => 
                    (record.customerName && record.customerName.toLowerCase().includes(searchTerm)) ||
                    record.phone.includes(searchTerm) ||
                    record.workType.toLowerCase().includes(searchTerm) ||
                    record.date.includes(searchTerm)
                );
            
            renderRecords(filtered);
        });

        // Close modal when clicking outside
        document.getElementById('deleteModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeDeleteModal();
            }
        });

        // Initial render
        updateStats();
        renderRecords();

        // Set today's date in Persian
        const today = new Date();
        const persianMonths = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
        const persianDate = new Intl.DateTimeFormat('fa-IR').format(today);
        // Don't auto-fill to allow user to enter their own date
    </script>
</body>
</html>
